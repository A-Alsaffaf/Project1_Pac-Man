<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pac-Man Game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body onload="initGame()">
    
    <div id="game-container">
        <h1 id="title" class="pac-font">Minimal Pac-Man</h1>
        <h2 id="score" class="pac-font">0</h2>
        <div id="maze-container"></div>
            <div id="lives-display">
               <div class="lives"><img src="./Images/PacManLive.png" alt="pac-man live"></div> 
               <div class="lives"><img src="./Images/PacManLive.png" alt="pac-man live"></div> 
               <div class="lives"><img src="./Images/PacManLive.png" alt="pac-man live"></div> 
            </div>
            <img id="mute" src="./Images/MuteLogo.png" alt="">
    </div>

    <div id="overlay">
        <div id="game-over-msg-container">
            <div id="end-msg-container">
                <h1 id="end-msg" class="pac-font"></h2>
            </div>
            <div id="end-btn-container">
                <button id="end-btn" class="pac-font">Play Again</button>
            </div>
            
        </div>
    </div>
    <audio id="background-audio" src="./Audios/Game_Over_Sound_Effect.mp3" loop></audio>
</body>
</html>
